name: Discover upstream IPK architectures
on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'
permissions:
  contents: read
concurrency:
  group: upstream-architecture-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.repository == 'rustwrt/packages'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install signature verifier
        run: |
          python3 -m venv "$RUNNER_TEMP/arch-venv"
          "$RUNNER_TEMP/arch-venv/bin/pip" install cryptography
      - name: Discover candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/arch-venv/bin/python" tools/discover-architectures.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: architecture-candidates
          path: architecture-candidates.json
          retention-days: 3
          if-no-files-found: warn
